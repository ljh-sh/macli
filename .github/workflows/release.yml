name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.0.0)'
        required: true
        default: v0.0.0-test

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch_label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            arch_label: darwin-arm64
          - runner: macos-13
            arch: x86_64
            arch_label: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          swift --version
          xcrun --show-sdk-version

      - name: Build & package
        run: |
          # Deterministic build env (mirrors .x-cmd/release.common.sh)
          export SOURCE_DATE_EPOCH=1700000000
          export ZERO_AR_DATE=1
          export TZ=UTC
          export LC_ALL=C

          .x-cmd/release "${{ matrix.arch_label == 'darwin-arm64' && 'arm64' || 'x86_64' }}"
          .x-cmd/release package-${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macli-${{ matrix.arch_label }}
          path: |
            .release-artifacts/macli-${{ matrix.arch_label }}.tar.xz
            .release-artifacts/BUILD_INFO.txt

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts

      - name: Create SHA256SUMS
        run: |
          cd artifacts
          shasum -a 256 macli-darwin-*.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/macli-darwin-arm64.tar.xz
            artifacts/macli-darwin-x64.tar.xz
            artifacts/SHA256SUMS
            artifacts/BUILD_INFO.txt
