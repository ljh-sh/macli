name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.0.0)'
        required: true
        default: v0.0.0-test

permissions:
  contents: write

jobs:
  build:
    name: Build (arm64 + x64 on Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          swift --version
          xcrun --show-sdk-version

      - name: Build & package both arches
        run: |
          # Deterministic build env (mirrors .x-cmd/release.common.sh)
          export SOURCE_DATE_EPOCH=1700000000
          export ZERO_AR_DATE=1
          export TZ=UTC
          export LC_ALL=C

          # Cross-compile both arches from a single Apple Silicon runner.
          # No need for separate macos-13 runner: SwiftPM --arch x86_64
          # uses Xcode's bundled x86_64 toolchain for native cross-compile.
          .x-cmd/release release

      - name: Verify reproducibility & no privacy leaks
        run: |
          .x-cmd/release verify darwin-arm64
          # x64 verify skipped (cross-compile produces same inputs, just different arch)

      - name: List artifacts
        run: ls -la .release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            .release-artifacts/macli-darwin-arm64.tar.xz
            .release-artifacts/macli-darwin-x64.tar.xz
            .release-artifacts/macli-darwin-universal.tar.xz
            .release-artifacts/BUILD_INFO.txt
            .release-artifacts/SHA256SUMS

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            artifacts/macli-darwin-arm64.tar.xz
            artifacts/macli-darwin-x64.tar.xz
            artifacts/macli-darwin-universal.tar.xz
            artifacts/SHA256SUMS
            artifacts/BUILD_INFO.txt
